name: SkillSpector Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skillspector:
    name: SkillSpector scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install SkillSpector
        run: python -m pip install --quiet "git+https://github.com/NVIDIA/skillspector.git"

      - name: Run SkillSpector (JSON)
        run: skillspector scan . --no-llm --format json --output skillspector-report.json

      - name: Run SkillSpector (Markdown)
        run: skillspector scan . --no-llm --format markdown --output skillspector-report.md

      - name: Summarize score and verdict
        id: parse_report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("skillspector-report.json").read_text(encoding="utf-8"))

          def find_first(node, key):
              if isinstance(node, dict):
                  if key in node:
                      return node[key]
                  for value in node.values():
                      found = find_first(value, key)
                      if found is not None:
                          return found
              elif isinstance(node, list):
                  for value in node:
                      found = find_first(value, key)
                      if found is not None:
                          return found
              return None

          risk_score = find_first(report, "risk_score")
          severity = find_first(report, "severity")
          recommendation = find_first(report, "recommendation")
          safe_to_install = find_first(report, "safe_to_install")

          safe = safe_to_install is True
          safe_text = "true" if safe else "false"

          summary_lines = [
              "## SkillSpector safety report",
              "",
              f"- risk_score: `{risk_score}`",
              f"- severity: `{severity}`",
              f"- recommendation: `{recommendation}`",
              f"- safe_to_install: `{safe_to_install}`",
          ]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(summary_lines) + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              outputs.write(f"safe_to_install={safe_text}\n")
              outputs.write(f"risk_score={risk_score}\n")
          PY

      - name: Upload SkillSpector artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-report
          path: |
            skillspector-report.json
            skillspector-report.md

      - name: Fail when unsafe
        if: steps.parse_report.outputs.safe_to_install != 'true'
        run: |
          echo "::error::SkillSpector marked this repository as unsafe to install."
          exit 1
