name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    # The matrix is the whole point: `.github/repository-metadata.yml` claims
    # 3.10 through 3.13, and a claimed version that nothing runs is a guess. The
    # floor is 3.10 rather than 3.9 because several scripts use PEP 604 unions
    # (`str | None`) in runtime signatures, which raise TypeError on 3.9 at import.
    name: "Skill QA (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"

      - name: All scripts compile
        run: python -m compileall -q scripts

      - name: Get skill-vision (the QA skill)
        run: git clone --depth 1 https://github.com/AlveeeRahman/skill-vision.git /tmp/skill-vision

      - name: Self-validate against the Agent Skills spec
        run: python /tmp/skill-vision/scripts/spec_validator.py .

      # Structure and truth are independent failures. A skill can conform to the spec
      # and still document a flag its own parser does not define, or claim a script
      # runs offline when it shells out to one that does not.
      - name: Audit documentation claims against the code
        run: python /tmp/skill-vision/scripts/claim_auditor.py .

      - name: Bundled scripts run
        run: |
          # script_tester exits 2 for PARTIAL. `|| code=$?` is required: GitHub runs
          # this under `bash -e`, so a bare failing command aborts the step before any
          # exit-code branch can run.
          code=0
          python /tmp/skill-vision/scripts/script_tester.py . || code=$?
          case "$code" in
            0) echo "All bundled scripts passed." ;;
            2) echo "::warning::script_tester reported PARTIAL (exit 2)" ;;
            *) echo "::error::script_tester exited $code"; exit 1 ;;
          esac

      - name: Install the one third-party dependency the network scripts need
        run: python -m pip install --quiet requests

      - name: Every CLI answers --help
        run: |
          for script in $(find scripts -name '*.py' -not -name '_*'); do
            python "$script" --help > /dev/null || {
              echo "::error::$script has no working --help"; exit 1; }
          done
